services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      AGENT_INTERNAL_SECRET: ${AGENT_INTERNAL_SECRET:-change-this-secret}
      AGENT_ENABLED_BLOCKS: ${AGENT_ENABLED_BLOCKS:-Sonari,Rajapara}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
      - ./evals:/app/evals

  scheduler:
    build: ./app
    command:
      [
        "sh",
        "-c",
        "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"
      ]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    expose:
      - "8025"

  citizen-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://app:8000}
      CITIZEN_MCP_URL: ${CITIZEN_MCP_URL:-http://localhost:8101}
      AGENT_INTERNAL_SECRET: ${AGENT_INTERNAL_SECRET:-change-this-secret}
      AGENT_ENABLED_BLOCKS: ${AGENT_ENABLED_BLOCKS:-Sonari,Rajapara}
      PORT: 8101
    ports:
      - "8101:8101"
    depends_on:
      - app

  officer-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://app:8000}
      OFFICER_MCP_URL: ${OFFICER_MCP_URL:-http://localhost:8102}
      AGENT_INTERNAL_SECRET: ${AGENT_INTERNAL_SECRET:-change-this-secret}
      AGENT_ENABLED_BLOCKS: ${AGENT_ENABLED_BLOCKS:-Sonari,Rajapara}
      PORT: 8102
    command: ["python", "-m", "agent_mcp.officer_server"]
    ports:
      - "8102:8102"
    depends_on:
      - app

  eval-runner:
    profiles: ["eval"]
    build:
      context: ./evals
      dockerfile: Dockerfile
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CITIZEN_MCP_URL: ${CITIZEN_MCP_URL:-http://localhost:8101/}
      OFFICER_MCP_URL: ${OFFICER_MCP_URL:-http://localhost:8102/}
      EVAL_CITIZEN_CONNECT_URL: http://citizen-mcp:8101/
      EVAL_OFFICER_CONNECT_URL: http://officer-mcp:8102/
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASSWORD: sewasetu123
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    volumes:
      - ./evals:/evals
    depends_on:
      - db
      - app
      - citizen-mcp
      - officer-mcp

volumes:
  pgdata:
  uploads:
  applogs: